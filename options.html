<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nexu - Gemini Settings</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:42px 22px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:linear-gradient(145deg,#070b18,#17164a 54%,#043447)}
main{width:min(760px,100%);margin:0 auto}
.shell{position:relative;overflow:hidden;border:1px solid rgba(107,212,255,.2);border-radius:22px;background:rgba(8,13,31,.82);box-shadow:0 26px 80px rgba(0,0,0,.42),0 0 46px rgba(0,184,255,.13),inset 0 1px 0 rgba(255,255,255,.1);backdrop-filter:blur(18px)}
.shell:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 8% 0%,rgba(69,214,255,.24),transparent 31%),radial-gradient(circle at 100% 2%,rgba(130,88,255,.2),transparent 28%);pointer-events:none}
.inner{position:relative;padding:30px}
.brand{display:flex;align-items:center;gap:18px;margin-bottom:28px}
.mark{width:88px;height:88px;border-radius:24px;background:linear-gradient(145deg,#0d1e4e,#0dcaf2);display:grid;place-items:center;box-shadow:0 16px 40px rgba(0,200,255,.24);overflow:hidden}
.mark img{width:104px;height:104px;object-fit:cover;object-position:center top;animation:bob 2.8s ease-in-out infinite}
.logo{width:176px;height:auto;display:block;filter:drop-shadow(0 0 14px rgba(0,200,255,.28))}
h1{margin:0;font-size:0;line-height:0}
p{margin:8px 0 0;color:#b8d7f4;font-size:14px;line-height:1.5}
label{display:block;margin-top:18px;color:#e5e7eb;font-size:13px;font-weight:900}
input{width:100%;height:48px;margin-top:8px;padding:0 14px;border:1px solid rgba(107,212,255,.18);border-radius:12px;background:rgba(255,255,255,.08);color:#fff;font-size:14px;outline:none}
input:focus{border-color:#6ee7ff;box-shadow:0 0 0 4px rgba(0,200,255,.15)}
.row{display:flex;align-items:center;gap:12px;margin-top:22px}
button{height:46px;padding:0 18px;border:0;border-radius:12px;background:linear-gradient(135deg,#f8fafc,#6ee7ff 48%,#7c3cff);color:#07111f;font-weight:900;cursor:pointer;box-shadow:0 15px 34px rgba(0,200,255,.18)}
#saved{color:#8fffe0;font-weight:900;font-size:13px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
</head>
<body>
<main>
  <section class="shell">
    <div class="inner">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <img src="assets/nexu-idle.png" alt="">
        </span>
        <div>
          <h1>Nexu</h1>
          <img class="logo" src="assets/nexu-logo.svg" alt="Nexu">
          <p>Screen Sage settings for fast option-only answers.</p>
        </div>
      </div>
      <label for="apiKey">Gemini API Key</label>
      <input id="apiKey" type="password" placeholder="Your Gemini API key" autocomplete="off">
      <label for="model">Model</label>
      <input id="model" value="gemini-3.6-flash">
      <div class="row">
        <button id="save">Save settings</button>
        <span id="saved"></span>
      </div>
    </div>
  </section>
</main>
<script src="options.js"></script>
</body>
</html>
